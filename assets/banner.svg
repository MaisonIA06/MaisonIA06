<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-label="Maison de l'IA — System UI banner">
  <defs>
    <!-- Matrice de points -->
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.6" fill="#7c3aed" opacity="0.35"/>
    </pattern>
    <pattern id="dotsCyan" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="2.2" fill="#22d3ee"/>
    </pattern>
    <pattern id="grid" width="110" height="110" patternUnits="userSpaceOnUse">
      <path d="M110 0H0V110" fill="none" stroke="#22d3ee" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <!-- Halo de balayage (se déplace de gauche à droite) -->
    <radialGradient id="sweep" gradientUnits="userSpaceOnUse" cx="0" cy="180" r="320">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="cx" values="-300;1700;-300" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="120;240;120" dur="7s" repeatCount="indefinite"/>
    </radialGradient>
    <mask id="sweepMask">
      <rect width="1400" height="360" fill="url(#sweep)"/>
    </mask>

    <!-- Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#0b0f19" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.9"/>
    </radialGradient>

    <!-- Dégradé du titre -->
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#f472b6"/>
      <animate attributeName="x1" values="0;-1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="1400" height="360" fill="#0b0f19"/>
  <rect width="1400" height="360" fill="url(#grid)"/>
  <rect width="1400" height="360" fill="url(#dots)"/>
  <rect width="1400" height="360" fill="url(#dotsCyan)" mask="url(#sweepMask)" opacity="0.9"/>
  <rect width="1400" height="360" fill="url(#vignette)"/>

  <!-- Ligne de scan -->
  <rect x="0" y="0" width="1400" height="3" fill="#22d3ee" opacity="0.35">
    <animateTransform attributeName="transform" type="translate" values="0 -10;0 370" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Flux de données (tirets animés) -->
  <g stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="10 14" opacity="0.6">
    <line x1="40" y1="300" x2="1360" y2="300">
      <animate attributeName="stroke-dashoffset" from="0" to="-240" dur="6s" repeatCount="indefinite"/>
    </line>
  </g>
  <g stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4 18" opacity="0.6">
    <line x1="40" y1="60" x2="1360" y2="60">
      <animate attributeName="stroke-dashoffset" from="0" to="220" dur="5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Coins HUD -->
  <g fill="none" stroke="#22d3ee" stroke-width="2.5" opacity="0.9">
    <polyline points="24,64 24,24 64,24"/>
    <polyline points="1336,24 1376,24 1376,64"/>
    <polyline points="24,296 24,336 64,336"/>
    <polyline points="1336,336 1376,336 1376,296"/>
  </g>

  <!-- Étiquettes système -->
  <g font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace" font-size="15" fill="#94a3b8">
    <text x="44" y="44" letter-spacing="1.5">MIA_06 :: SYSTEM_UI v2.0</text>
    <text x="1356" y="44" text-anchor="end" letter-spacing="1.5">
      <tspan fill="#22d3ee">●</tspan>
      <tspan dx="8" fill="#94a3b8">STATUS</tspan>
      <tspan dx="8" fill="#22d3ee" font-weight="700">ONLINE</tspan>
      <animate attributeName="opacity" values="1;1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Titre -->
  <g font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace" text-anchor="middle">
    <text x="700" y="172" font-size="78" font-weight="800" letter-spacing="6" fill="url(#titleGrad)" filter="url(#glow)">MAISON DE L'IA</text>
    <text x="700" y="214" font-size="21" letter-spacing="4" fill="#22d3ee" filter="url(#softGlow)">// L'INTELLIGENCE ARTIFICIELLE POUR TOUS — SOPHIA ANTIPOLIS</text>
    <text x="700" y="252" font-size="15" letter-spacing="3" fill="#f472b6">SENSIBILISER · FÉDÉRER · VALORISER · INSPIRER</text>
  </g>

  <!-- Invite terminal -->
  <g font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace" font-size="15" fill="#a78bfa">
    <text x="44" y="326">
      <tspan fill="#22d3ee">$</tspan>
      <tspan dx="8">mia --init --mode=public --since=2020 --location=06</tspan>
      <tspan dx="6" fill="#22d3ee">█<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan>
    </text>
    <text x="1356" y="326" text-anchor="end" fill="#94a3b8">+130 000 PERSONNES SENSIBILISÉES · 1 000 m²</text>
  </g>
</svg>
