# Génère l'animation "snake" des contributions (SVG) et la publie sur la branche `output`.
# Le README l'affiche via :
#   https://raw.githubusercontent.com/MaisonIA06/MaisonIA06/output/github-snake-dark.svg
name: Génération snake des contributions

on:
  schedule:
    - cron: "0 3 * * *"   # tous les jours à 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Générer les SVG (palette cyberpunk)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#4c1d95,#6d28d9,#a855f7,#ec4899
            dist/github-snake.svg?palette=github-light&color_snake=#7c3aed

      - name: Publier sur la branche output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
