# Panneau projets : fusionne projects.json avec les données GitHub (étoiles, langages,
# activité) puis publie projects.svg / projects-light.svg sur la branche `projects`.
name: Génération panneau projets

on:
  push:
    branches: [main]
    paths:
      - "projects.json"
      - "assets/icons/**"
      - "assets/icons-bleu/**"
      - ".github/scripts/generate_projects.py"
      - ".github/scripts/fetch_projects.py"
      - ".github/scripts/charte.py"
      - ".github/workflows/projects.yml"
  schedule:
    - cron: "0 4 * * *"   # tous les jours à 04:00 UTC (données fraîches)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les données des dépôts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/fetch_projects.py

      - name: Générer les SVG
        run: |
          mkdir -p out
          python3 .github/scripts/generate_projects.py merged.json out

      - name: Publier sur la branche projects
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: projects
          build_dir: out
          commit_message: "Mise à jour du panneau projets [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
